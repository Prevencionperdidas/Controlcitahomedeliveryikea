<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Cita y carga · CD El Sauce</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap"><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script><style>
:root{--bg:#f3f4f6;--sf:#fff;--tx:#14213d;--mu:#5b6578;--ln:#d9dde5;--bl:#0058a3;--ye:#ffda1a;--ok:#1b7f4b;--wa:#b36b00;--er:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1522;--sf:#172033;--tx:#e8ecf4;--mu:#9aa6bd;--ln:#2a3550;--bl:#6aa7e8;--ok:#4cc38a;--wa:#f0b04a;--er:#ff7b72}}
*{box-sizing:border-box}input,select,textarea{text-transform:uppercase}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Archivo,system-ui,sans-serif}
header{background:var(--bl);color:#fff;padding:14px 16px}header h1{margin:0;font-size:19px;font-weight:800}header small{opacity:.85}
nav{display:flex;gap:4px;margin-top:10px;overflow-x:auto}nav button{flex:1;min-width:92px;border:0;background:rgba(255,255,255,.15);color:#fff;padding:10px 8px;font:600 14px Archivo,sans-serif;border-radius:8px 8px 0 0;cursor:pointer}nav button.on{background:var(--bg);color:var(--tx);box-shadow:inset 0 3px var(--ye)}
main{max-width:980px;margin:0 auto;padding:16px}section{display:none}section.on{display:block}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px;margin-bottom:14px}h2{font-size:17px;margin:0 0 10px}h3{font-size:14px;margin:12px 0 6px;color:var(--mu)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}label{display:block;font-size:12.5px;color:var(--mu);font-weight:600}
input,select,textarea{width:100%;margin-top:3px;padding:9px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--bl);outline-offset:1px}
.b{border:0;border-radius:6px;padding:10px 14px;font:600 14px Archivo,sans-serif;cursor:pointer;background:var(--bl);color:#fff;margin:8px 6px 0 0}.b.y{background:var(--ye);color:#14213d}.b.r{background:var(--er)}.b.w{background:var(--wa)}.b.o{background:none;color:var(--tx);border:1px solid var(--ln)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--ln)}.tag.ok{background:var(--ok);color:#fff}.tag.wa{background:var(--wa);color:#fff}.tag.er{background:var(--er);color:#fff}.tag.bl{background:var(--bl);color:#fff}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}.kp div{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px}.kp b{display:block;font-size:26px;font-weight:800}.kp span{font-size:12px;color:var(--mu)}
table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--ln)}tr.c{cursor:pointer}tr.c:hover{background:var(--bg)}.sc{overflow-x:auto}
.qr{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.qr svg{width:150px;height:150px;background:#fff;padding:8px;border-radius:6px}
.tl{border-left:3px solid var(--bl);margin-left:6px;padding-left:12px}.tl div{margin:6px 0}.tl time{font-weight:800;margin-right:8px}
.big{font-size:22px;font-weight:800}.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px}.kv span:nth-child(odd){color:var(--mu)}
.al{padding:8px 10px;border-radius:6px;background:var(--wa);color:#fff;margin:8px 0;font-weight:600}.al.er{background:var(--er)}.al.ok{background:var(--ok)}
input,select{font-size:16px}.mu{color:var(--mu);font-size:13px}#err{color:var(--er);font-weight:600;margin:10px 0}.qrb{text-align:center}.qrb svg{width:210px;height:210px;background:#fff;padding:10px;border-radius:8px;margin:8px 0}a{color:var(--bl)}</style></head><body><header><h1>Cita y carga · CD El Sauce</h1><small>Para el conductor responsable de la ruta</small></header>
<main><div id="app"></div></main>
<script>
const API='https://script.google.com/macros/s/AKfycbwFqhQrUXklXPa0lmqtMKd-13YgNGi3NCKqKSt8mQGBkibNJEJZWkMgmKcva-wvFi0/exec';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST={CITA:['Esperando ingreso','bl'],PATIO:['En patio','wa'],CARGANDO:['Cargando','wa'],LISTO:['Datos enviados','ok'],DESPACHADO:['Despachado','ok'],RECHAZADO:['Rechazado','er'],RETENIDO:['Retenido','er']};
const tag=s=>`<span class="tag ${ST[s][1]}">${ST[s][0]}</span>`;
let cur,poll,sv=null;try{sv=JSON.parse(localStorage.getItem('cita')||'null')}catch(e){}
const guardar=()=>{try{sv?localStorage.setItem('cita',JSON.stringify(sv)):localStorage.removeItem('cita')}catch(e){}};
async function api(o){return(await fetch(API,{method:'POST',body:JSON.stringify(o)})).json()}
function rutOk(r){r=r.replace(/[.\-\s]/g,'').toUpperCase();if(!/^\d{7,8}[\dK]$/.test(r))return false;const d=r.slice(-1),n=r.slice(0,-1);let s=0,m=2;for(let i=n.length-1;i>=0;i--){s+=n[i]*m;m=m==7?2:m+1}const x=11-s%11;return(x==11?'0':x==10?'K':String(x))==d}
/* 1. CITA */
function formCita(){clearTimeout(poll);$('app').innerHTML=`<form class="card" id="f" onsubmit="return enviar(event)" novalidate><h2>Conductor</h2>
<label>Nombre completo<input name="cn" autocomplete="name"></label><label>RUT o N° de documento<input name="cr" placeholder="12.345.678-5"></label><label style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" name="cext" style="width:auto;margin:0" onchange="this.form.cr.placeholder=this.checked?'Pasaporte o documento':'12.345.678-5'"> Identificación extranjera (sin RUT)</label><label>Teléfono<input name="ct" type="tel" placeholder="+56 9 1234 5678"></label><label>Empresa transportista<input name="em"></label>
<h2 style="margin-top:18px">Peoneta (si viaja)</h2><label>Nombre completo<input name="pn"></label><label>RUT o N° de documento<input name="pr" placeholder="12.345.678-5"></label><label style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" name="pext" style="width:auto;margin:0" onchange="this.form.pr.placeholder=this.checked?'Pasaporte o documento':'12.345.678-5'"> Identificación extranjera (sin RUT)</label><label>Teléfono<input name="pt" type="tel"></label>
<h2 style="margin-top:18px">Vehículo</h2><label>Patente (PPU)<input name="ppu" placeholder="ABCD11" maxlength="6"></label><label>Tipo de vehículo<select name="tv"><option>Camión 3/4</option><option>Camión rampla</option><option>Furgón</option><option>Tracto + semirremolque</option></select></label>
<div id="err" role="alert"></div><button class="b y" id="bt" style="width:100%;padding:14px">Registrar cita y obtener QR</button>
<p class="mu">Usamos estos datos solo para el control de acceso y la trazabilidad de la operación en el CD.</p><p class="mu"><a href="#" onclick="recup();return false">Ya registré mi cita en otro dispositivo</a></p></form>`}
async function enviar(ev){ev.preventDefault();const t=Object.fromEntries([...new FormData($('f'))].map(([k,v])=>[k,String(v).trim().toUpperCase()])),e=$('err');e.textContent='';
for(const k of ['cn','cr','ct','em','ppu'])if(!t[k]){e.textContent='Completa los datos del conductor y la patente.';return false}
if(!t.cext&&!rutOk(t.cr)){e.textContent='El RUT del conductor no es válido. Revísalo o marca «Identificación extranjera».';return false}
if(t.pr&&!t.pext&&!rutOk(t.pr)){e.textContent='El RUT del peoneta no es válido. Revísalo o marca «Identificación extranjera».';return false}
t.ppu=t.ppu.replace(/\s/g,'');if(!/^([A-Z]{4}\d{2}|[A-Z]{2}\d{4})$/.test(t.ppu)){e.textContent='La patente debe tener formato ABCD11 o AB1234.';return false}
const b=$('bt');b.disabled=true;b.textContent='Registrando…';
try{const r=await api({a:'crear',t});if(!r.ok)throw r.error;sv={id:r.id,ppu:r.ppu};guardar();entrar()}catch(x){e.textContent='No pudimos registrar tu cita. Revisa tu conexión e inténtalo de nuevo.';b.disabled=false;b.textContent='Registrar cita y obtener QR'}return false}
function recup(){const id=prompt('ID del viaje (ej. HD-20261016-001)'),p=id&&prompt('Patente (PPU)');if(!id||!p)return;sv={id:id.trim().toUpperCase(),ppu:p.trim().toUpperCase().replace(/\s/g,'')};guardar();entrar()}
function nuevo(){sv=null;guardar();formCita()}
/* 2. ESPERA, CARGA Y SALIDA (se actualiza sola) */
async function entrar(){clearTimeout(poll);if(!sv)return formCita();
try{const r=await api({a:'drv_get',id:sv.id,ppu:sv.ppu});if(!r.ok){nuevo();return}cur=r.t;pintar();if(cur.st=='CITA'||cur.st=='LISTO')poll=setTimeout(entrar,10000)}catch(e){$('app').insertAdjacentHTML('afterbegin','<div class="al er">SIN CONEXIÓN. REINTENTANDO…</div>');poll=setTimeout(entrar,10000)}}
const qr=t=>{const q=qrcode(0,'M');q.addData(`${t.id}|${t.ppu}|${t.id.slice(3,11)}`);q.make();return`<div class="card qrb"><div class="big">${esc(t.id)}</div>${q.createSvgTag({cellSize:6,margin:0})}<div>PPU ${esc(t.ppu)}</div></div>`};
const res=t=>`<div class="kv"><span>Ruta</span><span>${esc(t.ruta)}</span><span>Vehículo</span><span>${esc(t.veh)}</span><span>Andén</span><span>${esc(t.and)}</span><span>Pallets / bultos / LPN</span><span><b>${t.pal} / ${t.bul} / ${t.lpn}</b></span><span>Carga</span><span>${t.ini||'—'} a ${t.fin||'—'}</span>${t.pre?`<span>Pallets préstamo</span><span><b>${t.pi+t.pa+t.pm}</b> (IKEA ${t.pi}, azul ${t.pa}, madera ${t.pm})</span>`:''}</div>`;
const bn='<button class="b y" onclick="nuevo()">Registrar un viaje nuevo</button>';
function pintar(){const t=cur,S=t.st;let h='';
if(S=='CITA')h=qr(t)+'<div class="al">Presenta este QR al controlador de acceso. Cuando autorice tu ingreso, esta pantalla pasará sola al registro de carga.</div>';
else{h=`<div class="card"><div class="big">${esc(t.id)}</div>${tag(S)}<div style="margin-top:6px">${esc(t.cn)} · ${esc(t.ppu)}</div></div>`;
if(S=='RECHAZADO'||S=='RETENIDO')h+=`<div class="al er">Tu viaje está ${ST[S][0].toLowerCase()}. Comunícate con el controlador de acceso o con el supervisor.</div>`+(S=='RECHAZADO'?bn:'');
else if(S=='DESPACHADO')h+='<div class="al ok">Viaje finalizado. Buen viaje.</div>'+bn;
else if(S=='LISTO')h+=`<div class="card"><h2>Datos enviados</h2>${res(t)}</div>${qr(t)}<div class="al ok">Para salir, presenta este QR al controlador de acceso: revisará tus datos y autorizará la salida.</div>`;
else h+=`<div class="card"><h2>Datos de la carga</h2><div class="g"><label>Ruta<input id="c_r" value="${esc(t.ruta)}"></label><label>N° de vehículo<input id="c_v" value="${esc(t.veh)}"></label><label>Andén<input id="c_a" value="${esc(t.and)}"></label><label>Pallets<input id="c_p" type="number" min="0" inputmode="numeric" value="${t.pal||''}"></label><label>Bultos<input id="c_b" type="number" min="0" inputmode="numeric" value="${t.bul||''}"></label><label>LPN<input id="c_l" type="number" min="0" inputmode="numeric" value="${t.lpn||''}"></label></div>
<label style="margin-top:12px"><input type="checkbox" id="c_pre" style="width:auto" ${t.pre?'checked':''} onchange="$('c_pp').style.display=this.checked?'grid':'none'"> Llevo pallets de préstamo</label>
<div class="g" id="c_pp" style="display:${t.pre?'grid':'none'};margin-top:8px"><label>Pallet IKEA<input id="c_pi" type="number" min="0" value="${t.pi}"></label><label>Pallet azul<input id="c_pa" type="number" min="0" value="${t.pa}"></label><label>Pallet madera<input id="c_pm" type="number" min="0" value="${t.pm}"></label></div>
<p>Inicio de carga: <b>${t.ini||'—'}</b></p><button class="b" onclick="drv('ini')" ${S=='CARGANDO'?'disabled':''}>Iniciar carga</button><button class="b o" onclick="drv('guardar')">Guardar datos</button><button class="b y" onclick="drv('fin')" ${S!='CARGANDO'?'disabled':''}>Finalizar y enviar</button></div>`}
$('app').innerHTML=h}
async function drv(x){if(x=='fin'&&!confirm('Al finalizar ya no podrás editar los datos. ¿Están correctos?'))return;const v=i=>$(i).value;
try{const r=await api({a:'drv_save',id:cur.id,ppu:cur.ppu,x,t:{ruta:v('c_r'),veh:v('c_v'),and:v('c_a'),pal:v('c_p'),bul:v('c_b'),lpn:v('c_l'),pre:$('c_pre').checked,pi:v('c_pi'),pa:v('c_pa'),pm:v('c_pm')}});if(!r.ok){alert(r.error);return}cur=r.t;pintar();if(cur.st=='LISTO')poll=setTimeout(entrar,10000)}catch(e){alert('SIN CONEXIÓN. REINTENTA.')}}
if(API.startsWith('PEGA'))$('app').innerHTML='<div class="al er">Falta pegar la URL de la planilla (API).</div>';else entrar();
</script></body></html>
