<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Registro de cita · CD El Sauce</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#f3f4f6;--sf:#fff;--tx:#14213d;--mu:#5b6578;--ln:#d9dde5;--bl:#0058a3;--ye:#ffda1a;--er:#b3261e;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1522;--sf:#172033;--tx:#e8ecf4;--mu:#9aa6bd;--ln:#2a3550;--bl:#6aa7e8;--er:#ff7b72}}
*{box-sizing:border-box}input,select{text-transform:uppercase}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,Arial,sans-serif}
header{background:var(--bl);color:#fff;padding:16px;border-bottom:4px solid var(--ye)}header h1{margin:0;font-size:20px}header p{margin:4px 0 0;opacity:.9;font-size:14px}
main{max-width:640px;margin:0 auto;padding:14px}.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px;margin-bottom:14px}
h2{font-size:16px;margin:0 0 8px}label{display:block;font-size:13px;color:var(--mu);font-weight:600;margin-top:10px}
input,select{width:100%;margin-top:3px;padding:12px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--bl);outline-offset:1px}
button{width:100%;border:0;border-radius:8px;padding:14px;font:700 16px system-ui,Arial,sans-serif;background:var(--ye);color:#14213d;cursor:pointer}button:disabled{opacity:.6}
.er{color:var(--er);font-weight:600;margin:10px 0}.mu{color:var(--mu);font-size:13px}.ok{text-align:center}.ok svg{width:210px;height:210px;background:#fff;padding:10px;border-radius:8px}.id{font-size:24px;font-weight:800;margin:8px 0}
</style></head><body>
<header><h1>Registro de cita · CD El Sauce</h1><p>Completa tus datos antes de llegar. Tendrás un código QR para presentar en portería.</p></header>
<main><div id="app"><form class="card" id="f" onsubmit="return enviar(event)" novalidate>
<h2>Conductor</h2>
<label>Nombre completo<input name="cn" autocomplete="name" required></label>
<label>RUT<input name="cr" placeholder="12.345.678-5" required></label>
<label>Teléfono<input name="ct" type="tel" placeholder="+56 9 1234 5678" required></label>
<label>Empresa transportista<input name="em" required></label>
<label>Licencia de conducir<input name="li" placeholder="Clase A2" required></label>
<h2 style="margin-top:20px">Peoneta (si viaja)</h2>
<label>Nombre completo<input name="pn"></label><label>RUT<input name="pr"></label><label>Teléfono<input name="pt" type="tel"></label>
<h2 style="margin-top:20px">Vehículo</h2>
<label>Patente (PPU)<input name="ppu" placeholder="ABCD11" maxlength="6" style="text-transform:uppercase" required></label>
<label>Tipo de vehículo<select name="tv"><option>Camión 3/4</option><option>Camión rampla</option><option>Furgón</option><option>Tracto + semirremolque</option></select></label>
<div class="er" id="err" role="alert"></div>
<button id="bt">Registrar cita y obtener QR</button>
<p class="mu">Usamos estos datos solo para controlar el acceso y la trazabilidad de la operación en el CD.</p></form></div></main>
<script>
const API='PEGA_AQUI_URL_APPS_SCRIPT';
const $=id=>document.getElementById(id);
function rutOk(r){r=r.replace(/[.\-\s]/g,'').toUpperCase();if(!/^\d{7,8}[\dK]$/.test(r))return false;const d=r.slice(-1),n=r.slice(0,-1);let s=0,m=2;for(let i=n.length-1;i>=0;i--){s+=n[i]*m;m=m==7?2:m+1}const x=11-s%11;return(x==11?'0':x==10?'K':String(x))==d}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function enviar(ev){ev.preventDefault();const f=$('f'),t=Object.fromEntries([...new FormData(f)].map(([k,v])=>[k,String(v).trim().toUpperCase()])),e=$('err');e.textContent='';
for(const k of ['cn','cr','ct','em','li','ppu'])if(!t[k].trim()){e.textContent='Completa todos los datos del conductor y la patente.';return false}
if(!rutOk(t.cr)){e.textContent='El RUT del conductor no es válido. Revísalo.';return false}
if(t.pr.trim()&&!rutOk(t.pr)){e.textContent='El RUT del peoneta no es válido. Revísalo.';return false}
t.ppu=t.ppu.toUpperCase().replace(/\s/g,'');if(!/^([A-Z]{4}\d{2}|[A-Z]{2}\d{4})$/.test(t.ppu)){e.textContent='La patente debe tener formato ABCD11 o AB1234.';return false}
if(API.startsWith('PEGA')){e.textContent='El formulario aún no está conectado a la planilla.';return false}
const b=$('bt');b.disabled=true;b.textContent='Registrando…';
try{const r=await(await fetch(API,{method:'POST',body:JSON.stringify({a:'crear',t})})).json();if(!r.ok)throw r.error;
const q=qrcode(0,'M');q.addData(`${r.id}|${r.ppu}|${r.fecha}`);q.make();
$('app').innerHTML=`<div class="card ok"><h2>Cita registrada</h2>${q.createSvgTag({cellSize:6,margin:0})}<div class="id">${esc(r.id)}</div><div>Patente ${esc(r.ppu)}</div><p class="mu">Toma una captura de esta pantalla y muéstrala al guardia al llegar. Cada viaje necesita su propio registro.</p><button onclick="location.reload()">Registrar otro viaje</button></div>`}
catch(x){e.textContent='No pudimos registrar tu cita. Revisa tu conexión e inténtalo de nuevo.';b.disabled=false;b.textContent='Registrar cita y obtener QR'}
return false}
</script></body></html>
