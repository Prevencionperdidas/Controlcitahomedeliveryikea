<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Dashboard · CD El Sauce</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">

<style>
:root{--bg:#f3f4f6;--sf:#fff;--tx:#14213d;--mu:#5b6578;--ln:#d9dde5;--bl:#0058a3;--ye:#ffda1a;--ok:#1b7f4b;--wa:#b36b00;--er:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1522;--sf:#172033;--tx:#e8ecf4;--mu:#9aa6bd;--ln:#2a3550;--bl:#6aa7e8;--ok:#4cc38a;--wa:#f0b04a;--er:#ff7b72}}
*{box-sizing:border-box}input,select,textarea{text-transform:uppercase}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Archivo,system-ui,sans-serif}
header{background:var(--bl);color:#fff;padding:14px 16px}header h1{margin:0;font-size:19px;font-weight:800}header small{opacity:.85}
nav{display:flex;gap:4px;margin-top:10px;overflow-x:auto}nav button{flex:1;min-width:92px;border:0;background:rgba(255,255,255,.15);color:#fff;padding:10px 8px;font:600 14px Archivo,sans-serif;border-radius:8px 8px 0 0;cursor:pointer}nav button.on{background:var(--bg);color:var(--tx);box-shadow:inset 0 3px var(--ye)}
main{max-width:980px;margin:0 auto;padding:16px}section{display:none}section.on{display:block}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px;margin-bottom:14px}h2{font-size:17px;margin:0 0 10px}h3{font-size:14px;margin:12px 0 6px;color:var(--mu)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}label{display:block;font-size:12.5px;color:var(--mu);font-weight:600}
input,select,textarea{width:100%;margin-top:3px;padding:9px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--bl);outline-offset:1px}
.b{border:0;border-radius:6px;padding:10px 14px;font:600 14px Archivo,sans-serif;cursor:pointer;background:var(--bl);color:#fff;margin:8px 6px 0 0}.b.y{background:var(--ye);color:#14213d}.b.r{background:var(--er)}.b.w{background:var(--wa)}.b.o{background:none;color:var(--tx);border:1px solid var(--ln)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--ln)}.tag.ok{background:var(--ok);color:#fff}.tag.wa{background:var(--wa);color:#fff}.tag.er{background:var(--er);color:#fff}.tag.bl{background:var(--bl);color:#fff}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}.kp div{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px}.kp b{display:block;font-size:26px;font-weight:800}.kp span{font-size:12px;color:var(--mu)}
table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--ln)}tr.c{cursor:pointer}tr.c:hover{background:var(--bg)}.sc{overflow-x:auto}
.qr{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.qr svg{width:150px;height:150px;background:#fff;padding:8px;border-radius:6px}
.tl{border-left:3px solid var(--bl);margin-left:6px;padding-left:12px}.tl div{margin:6px 0}.tl time{font-weight:800;margin-right:8px}
.big{font-size:22px;font-weight:800}.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px}.kv span:nth-child(odd){color:var(--mu)}
.al{padding:8px 10px;border-radius:6px;background:var(--wa);color:#fff;margin:8px 0;font-weight:600}.al.er{background:var(--er)}.al.ok{background:var(--ok)}
</style></head><body>
<header><h1>Dashboard · CD El Sauce</h1><small>Vista del supervisor · </small><small id="net"></small>
</header>
<main>
<section id="dash" class="on"><div class="kp" id="kp"></div><div class="card"><h2>Viajes de hoy y con pallets pendientes</h2><div class="sc"><table id="tb"></table></div></div><div class="card" id="det"><h2>Trazabilidad</h2><p style="color:var(--mu)">Toca un viaje para ver su historial completo.</p></div></section>
</main>
<script>
const API='https://script.google.com/macros/s/AKfycbwFqhQrUXklXPa0lmqtMKd-13YgNGi3NCKqKSt8mQGBkibNJEJZWkMgmKcva-wvFi0/exec';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hh=()=>new Date().toTimeString().slice(0,5);
const ST={CITA:['Cita válida','bl'],PATIO:['En patio','wa'],CARGANDO:['Cargando','wa'],LISTO:['Listo para salida','ok'],DESPACHADO:['Despachado','ok'],RECHAZADO:['Rechazado','er'],RETENIDO:['Retenido','er']};
const tag=s=>`<span class="tag ${ST[s][1]}">${ST[s][0]}</span>`;
let T=[],K2=sessionStorage.getItem('ks')||prompt('Clave de supervisor')||'';sessionStorage.setItem('ks',K2);
const get=id=>T.find(t=>t.id===id);
async function api(o){return(await fetch(API,{method:'POST',body:JSON.stringify({...o,k:K2})})).json()}
async function load(){try{const r=await api({a:'list'});if(!r.ok){if(r.error=='clave'){K2='';sessionStorage.removeItem('ks');$('net').textContent='Clave incorrecta: recarga la página';return}throw r.error}T=r.t;$('net').textContent='Conectado a la planilla · '+hh();dash()}catch(e){$('net').textContent='Sin conexión con la planilla'}}
function dash(){const n=s=>T.filter(t=>t.st==s).length,sum=f=>T.reduce((a,t)=>a+(f(t)||0),0);
const pr=sum(t=>t.pi+t.pa+t.pm),dv=sum(t=>t.dev);
const k=[['Esperando ingreso',n('CITA')],['En carga / patio',n('CARGANDO')+n('PATIO')+n('LISTO')],['Despachados',n('DESPACHADO')],['Rutas del día',T.filter(t=>t.ruta).length],['Pallets cargados',sum(t=>t.pal)],['LPN despachados',sum(t=>t.st=='DESPACHADO'?t.lpn:0)],['Rechazados / retenidos',n('RECHAZADO')+n('RETENIDO')],['PPU no coincide',sum(t=>t.alerta)],['Pallets prestados',pr],['Pallets devueltos',dv],['Saldo pendiente',pr-dv]];
$('kp').innerHTML=k.map(([a,b])=>`<div><b${a=='Saldo pendiente'&&b>0||a=='PPU no coincide'&&b>0?' style="color:var(--er)"':''}>${b}</b><span>${a}</span></div>`).join('');
$('tb').innerHTML='<tr><th>ID</th><th>Conductor</th><th>PPU</th><th>Ruta</th><th>Andén</th><th>Estado</th><th>Saldo pallets</th></tr>'+T.map(t=>{const s=(t.pi+t.pa+t.pm)-t.dev||0;return`<tr class="c" onclick="det('${t.id}')"><td>${t.id}</td><td>${esc(t.cn)}</td><td>${esc(t.ppu)}</td><td>${esc(t.ruta)||'—'}</td><td>${esc(t.and)||'—'}</td><td>${tag(t.st)}</td><td>${t.pre?(s>0?`<b style="color:var(--er)">${s}</b> <button class="b o" style="margin:0;padding:3px 8px" onclick="event.stopPropagation();devol('${t.id}')">Devolver</button>`:'0'):'—'}</td></tr>`}).join('')}
async function devol(id){const t=get(id),s=(t.pi+t.pa+t.pm)-t.dev,x=+prompt(`Pallets devueltos (pendientes: ${s})`,s);if(!x||x<0||x>s)return;const r=await api({a:'devol',id,n:x});if(!r.ok)alert(r.error);await load();det(id)}
function det(id){const t=get(id);$('det').innerHTML=`<h2>Trazabilidad · ${t.id}</h2><p>${esc(t.cn)} · ${esc(t.em)} · ${esc(t.ppu)} ${tag(t.st)}</p><div class="tl">${[...t.ev].sort((a,b)=>a.h.localeCompare(b.h)).map(e=>`<div class="${e.m.startsWith('ALERTA')?'':''}"><time>${e.h}</time>${esc(e.m)}${e.u?` <small style="color:var(--mu)">· ${esc(e.u)}</small>`:''}</div>`).join('')}</div>`}
if(API.startsWith('PEGA'))$('net').textContent='Falta pegar la URL de la planilla (API)';else load();
setInterval(()=>{if(K2&&!API.startsWith('PEGA'))load()},20000);
</script></body></html>
