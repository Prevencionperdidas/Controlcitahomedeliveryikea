<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Control de viajes · CD El Sauce</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#f3f4f6;--sf:#fff;--tx:#14213d;--mu:#5b6578;--ln:#d9dde5;--bl:#0058a3;--ye:#ffda1a;--ok:#1b7f4b;--wa:#b36b00;--er:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1522;--sf:#172033;--tx:#e8ecf4;--mu:#9aa6bd;--ln:#2a3550;--bl:#6aa7e8;--ok:#4cc38a;--wa:#f0b04a;--er:#ff7b72}}
*{box-sizing:border-box}input,select,textarea{text-transform:uppercase}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Archivo,system-ui,sans-serif}
header{background:var(--bl);color:#fff;padding:14px 16px 0}header h1{margin:0;font-size:19px;font-weight:800}header small{opacity:.85}
nav{display:flex;gap:4px;margin-top:10px;overflow-x:auto}nav button{flex:1;min-width:92px;border:0;background:rgba(255,255,255,.15);color:#fff;padding:10px 8px;font:600 14px Archivo,sans-serif;border-radius:8px 8px 0 0;cursor:pointer}nav button.on{background:var(--bg);color:var(--tx);box-shadow:inset 0 3px var(--ye)}
main{max-width:980px;margin:0 auto;padding:16px}section{display:none}section.on{display:block}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px;margin-bottom:14px}h2{font-size:17px;margin:0 0 10px}h3{font-size:14px;margin:12px 0 6px;color:var(--mu)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}label{display:block;font-size:12.5px;color:var(--mu);font-weight:600}
input,select,textarea{width:100%;margin-top:3px;padding:9px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--bl);outline-offset:1px}
.b{border:0;border-radius:6px;padding:10px 14px;font:600 14px Archivo,sans-serif;cursor:pointer;background:var(--bl);color:#fff;margin:8px 6px 0 0}.b.y{background:var(--ye);color:#14213d}.b.r{background:var(--er)}.b.w{background:var(--wa)}.b.o{background:none;color:var(--tx);border:1px solid var(--ln)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--ln)}.tag.ok{background:var(--ok);color:#fff}.tag.wa{background:var(--wa);color:#fff}.tag.er{background:var(--er);color:#fff}.tag.bl{background:var(--bl);color:#fff}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}.kp div{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px}.kp b{display:block;font-size:26px;font-weight:800}.kp span{font-size:12px;color:var(--mu)}
table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--ln)}tr.c{cursor:pointer}tr.c:hover{background:var(--bg)}.sc{overflow-x:auto}
.qr{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.qr svg{width:150px;height:150px;background:#fff;padding:8px;border-radius:6px}
.tl{border-left:3px solid var(--bl);margin-left:6px;padding-left:12px}.tl div{margin:6px 0}.tl time{font-weight:800;margin-right:8px}
.big{font-size:22px;font-weight:800}.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px}.kv span:nth-child(odd){color:var(--mu)}
.al{padding:8px 10px;border-radius:6px;background:var(--wa);color:#fff;margin:8px 0;font-weight:600}.al.er{background:var(--er)}.al.ok{background:var(--ok)}
</style></head><body>
<header><h1>Control de viajes · CD El Sauce</h1><small>Acceso, andén, salida y dashboard · </small><small id="net"></small>
<nav id="nav"><button data-v="guardia" class="on">Guardia</button><button data-v="anden">Andén</button><button data-v="dash">Dashboard</button></nav></header>
<main>
<section id="guardia" class="on"><div class="card"><h2>Control de acceso</h2><div class="g"><label>Guardia<input id="gd" value="Guardia 1"></label><label>Escanear o elegir ID<select id="gsel" onchange="gid.value=this.value;buscar()"></select></label><label>ID del viaje<input id="gid" placeholder="HD-20261016-001"></label></div>
<button class="b" onclick="load().then(buscar)">Buscar viaje</button><button class="b o" onclick="camara()">Escanear con cámara</button><video id="vid" style="display:none;width:100%;max-width:320px;margin-top:8px"></video></div><div id="gout"></div></section>

<section id="anden"><div class="card"><h2>Registro operativo en andén</h2><label>Viaje en patio<select id="asel" onchange="cargarAnden()"></select></label><div id="aout"></div></div></section>

<section id="dash"><div class="kp" id="kp"></div><div class="card"><h2>Viajes de hoy y con pallets pendientes</h2><div class="sc"><table id="tb"></table></div></div><div class="card" id="det"><h2>Trazabilidad</h2><p style="color:var(--mu)">Toca un viaje para ver su historial completo.</p></div></section>
</main>
<script>
const $=id=>document.getElementById(id),K='cdviajes1';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const API='PEGA_AQUI_URL_APPS_SCRIPT';
const hh=()=>new Date().toTimeString().slice(0,5),hoy=()=>{const d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')};
let T=[],K2=sessionStorage.getItem('k')||prompt('Clave de acceso')||'';sessionStorage.setItem('k',K2);
const ST={CITA:['Cita válida','bl'],PATIO:['En patio','wa'],CARGANDO:['Cargando','wa'],LISTO:['Listo para salida','ok'],DESPACHADO:['Despachado','ok'],RECHAZADO:['Rechazado','er'],RETENIDO:['Retenido','er']};
const tag=s=>`<span class="tag ${ST[s][1]}">${ST[s][0]}</span>`;
const get=id=>T.find(t=>t.id===id);
const ev=(t,m,u)=>{t._n={m,u:u||''}};
async function api(o){return(await fetch(API,{method:'POST',body:JSON.stringify({...o,k:K2})})).json()}
async function load(){try{const r=await api({a:'list'});if(!r.ok){if(r.error=='clave'){K2='';sessionStorage.removeItem('k');$('net').textContent='Clave incorrecta: recarga la página';return}throw r.error}T=r.t;$('net').textContent='Conectado a la planilla · '+hh()}catch(e){$('net').textContent='Sin conexión con la planilla'}}
async function push(t){const e=t._n;delete t._n;if(e){e.m=e.m.toUpperCase();e.u=e.u.toUpperCase()}['ruta','veh','and'].forEach(k=>t[k]=String(t[k]||'').toUpperCase());const{ev:_,...c}=t;$('net').textContent='Guardando…';try{const r=await api({a:'save',t:c,e});if(!r.ok)throw r.error}catch(x){alert('No se pudo guardar en la planilla: '+x)}await load()}
function nav(v){document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===v));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));load().then(()=>{if(v=='dash')dash();else opts()})}
$('nav').onclick=e=>{if(e.target.dataset.v)nav(e.target.dataset.v)};

function opts(){const l=a=>a.map(t=>`<option value="${t.id}">${t.id} · ${esc(t.ppu)} · ${ST[t.st][0]}</option>`).join('');
const g=$('gsel');g.innerHTML='<option value="">— elegir —</option>'+l(T);
const p=T.filter(t=>t.st=='PATIO'||t.st=='CARGANDO'),a=$('asel'),c=a.value;a.innerHTML=p.length?l(p):'<option value="">No hay viajes en patio</option>';if(c)a.value=c;cargarAnden()}

function buscar(){const id=$('gid').value.trim().toUpperCase(),t=get(id),o=$('gout');
if(!t){o.innerHTML='<div class="al er">ID no encontrado. Revisa el código o pide al transportista registrar la cita.</div>';return}
const vencida=!t.id.includes(hoy()),g=$('gd').value||'Guardia';
let h=`<div class="card"><div class="big">${t.id}</div>${tag(t.st)}${vencida?'<div class="al er">Cita vencida: no corresponde a hoy</div>':''}
<div class="kv" style="margin-top:10px"><span>Conductor</span><span>${esc(t.cn)}</span><span>RUT</span><span>${esc(t.cr)}</span><span>Peoneta</span><span>${esc(t.pn)||'—'}</span><span>Empresa</span><span>${esc(t.em)}</span><span>PPU en cita</span><span><b>${esc(t.ppu)}</b></span>`;
if(t.ruta)h+=`<span>Ruta / andén</span><span>${esc(t.ruta)} / ${esc(t.and)}</span><span>Pallets</span><span>${t.pal}</span>`;
if(t.pre)h+=`<span>Pallets préstamo</span><span>${t.pi+t.pa+t.pm} (IKEA ${t.pi}, azul ${t.pa}, madera ${t.pm})</span>`;
h+=`</div><div class="g" style="margin-top:10px"><label>PPU que ves en el camión<input id="gp" style="text-transform:uppercase"></label><label>Observaciones<input id="go"></label></div>`;
if(t.st=='CITA'&&!vencida)h+=`<button class="b" onclick="acc('${t.id}','in')">Autorizar ingreso</button><button class="b r" onclick="acc('${t.id}','rej')">Rechazar</button>`;
if(t.st=='LISTO')h+=`<button class="b" onclick="acc('${t.id}','out')">Autorizar salida</button><button class="b w" onclick="acc('${t.id}','ret')">Retener</button>`;
h+=`<button class="b o" onclick="acc('${t.id}','nov')">Registrar novedad</button>`;
if(t.st=='CARGANDO'||t.st=='PATIO')h+='<div class="al">Aún en operación: la salida se habilita al terminar la carga.</div>';
h+='</div>';o.innerHTML=h}
async function acc(id,a){const t=get(id),g=$('gd').value||'Guardia',p=($('gp').value||'').toUpperCase().trim(),ob=$('go').value.trim();
if(a=='in'||a=='out'){if(!p){alert('Ingresa la PPU que ves en el camión.');return}
if(p!==t.ppu){ev(t,`ALERTA: PPU no coincide (cita ${t.ppu}, vista ${p}). ${a=='in'?'Ingreso':'Salida'} bloqueado`,g);t.alerta=(t.alerta||0)+1;await push(t);buscar();$('gout').insertAdjacentHTML('afterbegin','<div class="al er">PPU no coincide con la cita. Posible suplantación: no autorices y avisa al supervisor.</div>');return}}
if(a=='in'){t.st='PATIO';ev(t,'Ingreso autorizado'+(ob?': '+ob:''),g)}
if(a=='rej'){t.st='RECHAZADO';ev(t,'Ingreso rechazado'+(ob?': '+ob:''),g)}
if(a=='out'){t.st='DESPACHADO';ev(t,'Salida autorizada'+(ob?': '+ob:''),g)}
if(a=='ret'){t.st='RETENIDO';ev(t,'Salida retenida'+(ob?': '+ob:''),g)}
if(a=='nov'){if(!ob){alert('Escribe la novedad en Observaciones.');return}ev(t,'Novedad: '+ob,g)}
await push(t);buscar();opts()}
async function camara(){if(!('BarcodeDetector' in window)){alert('Este navegador no lee QR. Escribe o elige el ID.');return}
try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}),v=$('vid');v.srcObject=s;v.style.display='block';await v.play();const d=new BarcodeDetector({formats:['qr_code']});
const L=async()=>{const r=await d.detect(v);if(r.length){$('gid').value=r[0].rawValue.split('|')[0];s.getTracks().forEach(x=>x.stop());v.style.display='none';load().then(buscar)}else if(v.srcObject)setTimeout(L,300)};L()}catch(e){alert('No se pudo abrir la cámara.')}}

function cargarAnden(){const t=get($('asel').value),o=$('aout');if(!t){o.innerHTML='';return}
o.innerHTML=`<h3>${t.id} · ${esc(t.cn)} · ${esc(t.ppu)} ${tag(t.st)}</h3><div class="g"><label>Ruta<input id="a_r" value="${esc(t.ruta)}"></label><label>N° vehículo<input id="a_v" value="${esc(t.veh)}"></label><label>Andén<input id="a_a" value="${esc(t.and)}"></label><label>Pallets<input id="a_p" type="number" min="0" value="${t.pal||''}"></label><label>Bultos<input id="a_b" type="number" min="0" value="${t.bul||''}"></label><label>LPN<input id="a_l" type="number" min="0" value="${t.lpn||''}"></label></div>
<label style="margin-top:12px"><input type="checkbox" id="a_pre" style="width:auto" ${t.pre?'checked':''} onchange="$('a_pp').style.display=this.checked?'grid':'none'"> Lleva pallets de préstamo</label>
<div class="g" id="a_pp" style="display:${t.pre?'grid':'none'};margin-top:8px"><label>Pallet IKEA<input id="a_pi" type="number" min="0" value="${t.pi}"></label><label>Pallet azul<input id="a_pa" type="number" min="0" value="${t.pa}"></label><label>Pallet madera<input id="a_pm" type="number" min="0" value="${t.pm}"></label></div>
<p>Inicio: <b>${t.ini||'—'}</b> · Fin: <b>${t.fin||'—'}</b></p>
<button class="b" onclick="gAnden('ini')" ${t.st=='CARGANDO'?'disabled':''}>Iniciar carga</button><button class="b y" onclick="gAnden('fin')" ${t.st!='CARGANDO'?'disabled':''}>Finalizar carga</button><button class="b o" onclick="gAnden()">Guardar datos</button>`}
async function gAnden(x){const t=get($('asel').value);if(!t)return;const v=i=>$(i).value;
Object.assign(t,{ruta:v('a_r'),veh:v('a_v'),and:v('a_a'),pal:+v('a_p')||0,bul:+v('a_b')||0,lpn:+v('a_l')||0,pre:$('a_pre').checked,pi:+v('a_pi')||0,pa:+v('a_pa')||0,pm:+v('a_pm')||0});if(!t.pre)t.pi=t.pa=t.pm=0;
if(x=='ini'){if(!t.and||!t.ruta){alert('Completa ruta y andén.');return}t.st='CARGANDO';t.ini=hh();ev(t,`Inicio de carga en andén ${t.and}`)}
if(x=='fin'){t.st='LISTO';t.fin=hh();ev(t,`Fin de carga: ${t.pal} pallets, ${t.lpn} LPN`+(t.pre?`, préstamo ${t.pi+t.pa+t.pm}`:''))}
await push(t);opts();cargarAnden()}

function dash(){const n=s=>T.filter(t=>t.st==s).length,sum=f=>T.reduce((a,t)=>a+(f(t)||0),0);
const pr=sum(t=>t.pi+t.pa+t.pm),dv=sum(t=>t.dev);
const k=[['Esperando ingreso',n('CITA')],['En carga / patio',n('CARGANDO')+n('PATIO')+n('LISTO')],['Despachados',n('DESPACHADO')],['Rutas del día',T.filter(t=>t.ruta).length],['Pallets cargados',sum(t=>t.pal)],['LPN despachados',sum(t=>t.st=='DESPACHADO'?t.lpn:0)],['Rechazados / retenidos',n('RECHAZADO')+n('RETENIDO')],['PPU no coincide',sum(t=>t.alerta)],['Pallets prestados',pr],['Pallets devueltos',dv],['Saldo pendiente',pr-dv]];
$('kp').innerHTML=k.map(([a,b])=>`<div><b${a=='Saldo pendiente'&&b>0||a=='PPU no coincide'&&b>0?' style="color:var(--er)"':''}>${b}</b><span>${a}</span></div>`).join('');
$('tb').innerHTML='<tr><th>ID</th><th>Conductor</th><th>PPU</th><th>Ruta</th><th>Andén</th><th>Estado</th><th>Saldo pallets</th></tr>'+T.map(t=>{const s=(t.pi+t.pa+t.pm)-t.dev||0;return`<tr class="c" onclick="det('${t.id}')"><td>${t.id}</td><td>${esc(t.cn)}</td><td>${esc(t.ppu)}</td><td>${esc(t.ruta)||'—'}</td><td>${esc(t.and)||'—'}</td><td>${tag(t.st)}</td><td>${t.pre?(s>0?`<b style="color:var(--er)">${s}</b> <button class="b o" style="margin:0;padding:3px 8px" onclick="event.stopPropagation();devol('${t.id}')">Devolver</button>`:'0'):'—'}</td></tr>`}).join('')}
async function devol(id){const t=get(id),s=(t.pi+t.pa+t.pm)-t.dev,x=+prompt(`Pallets devueltos (pendientes: ${s})`,s);if(!x||x<0||x>s)return;t.dev+=x;ev(t,`Devolución de ${x} pallets`,'Recepción');await push(t);dash();det(id)}
function det(id){const t=get(id);$('det').innerHTML=`<h2>Trazabilidad · ${t.id}</h2><p>${esc(t.cn)} · ${esc(t.em)} · ${esc(t.ppu)} ${tag(t.st)}</p><div class="tl">${[...t.ev].sort((a,b)=>a.h.localeCompare(b.h)).map(e=>`<div class="${e.m.startsWith('ALERTA')?'':''}"><time>${e.h}</time>${esc(e.m)}${e.u?` <small style="color:var(--mu)">· ${esc(e.u)}</small>`:''}</div>`).join('')}</div>`}
if(API.startsWith('PEGA'))$('net').textContent='Falta pegar la URL de la planilla (API)';else load().then(opts);
setInterval(()=>{if(!K2||API.startsWith('PEGA'))return;load().then(()=>{if($('dash').classList.contains('on'))dash()})},20000);
</script></body></html>
